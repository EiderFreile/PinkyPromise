<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="114" fill="#000000"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#8B6914" stroke-width="2" opacity="0.7"/>

  <!-- Sparkles esquinas (dibujadas, sin emoji) -->
  <g stroke="#C9A84C" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="64" x2="80" y2="96"/><line x1="64" y1="80" x2="96" y2="80"/>
    <line x1="69" y1="69" x2="91" y2="91"/><line x1="91" y1="69" x2="69" y2="91"/>
    <line x1="432" y1="64" x2="432" y2="96"/><line x1="416" y1="80" x2="448" y2="80"/>
    <line x1="421" y1="69" x2="443" y2="91"/><line x1="443" y1="69" x2="421" y2="91"/>
  </g>
  <g stroke="#8B6914" stroke-linecap="round" opacity="0.7">
    <line x1="80" y1="425" x2="80" y2="449"/><line x1="68" y1="437" x2="92" y2="437"/>
    <line x1="432" y1="425" x2="432" y2="449"/><line x1="420" y1="437" x2="444" y2="437"/>
  </g>

  <!-- Pinky (sin sombra) -->
  <text x="256" y="178" text-anchor="middle"
    font-family="Georgia, serif" font-style="italic"
    font-size="86" fill="#E8C97A">Pinky</text>

  <!-- Promise (sin sombra) -->
  <text x="256" y="246" text-anchor="middle"
    font-family="Georgia, serif" font-style="italic"
    font-size="64" fill="#C9A84C">Promise</text>

  <!-- Línea + diamante -->
  <line x1="100" y1="268" x2="412" y2="268" stroke="#8B6914" stroke-width="1.5"/>
  <polygon points="256,258 264,268 256,278 248,268" fill="#C9A84C"/>

  <!-- NAIL CLUB -->
  <text x="256" y="308" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="38"
    letter-spacing="6" fill="#FAF0DC">NAIL CLUB</text>

  <!-- Segunda línea -->
  <line x1="100" y1="326" x2="412" y2="326" stroke="#8B6914" stroke-width="1"/>

  <!-- est. 2026 con estrellitas dibujadas -->
  <text x="256" y="364" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="24"
    fill="#8B6914" letter-spacing="2">est. 2026</text>
  <!-- Estrella izquierda -->
  <g stroke="#8B6914" stroke-linecap="round" stroke-width="1.5">
    <line x1="158" y1="356" x2="158" y2="366"/><line x1="153" y1="361" x2="163" y2="361"/>
    <line x1="155" y1="358" x2="161" y2="364"/><line x1="161" y1="358" x2="155" y2="364"/>
  </g>
  <!-- Estrella derecha -->
  <g stroke="#8B6914" stroke-linecap="round" stroke-width="1.5">
    <line x1="354" y1="356" x2="354" y2="366"/><line x1="349" y1="361" x2="359" y2="361"/>
    <line x1="351" y1="358" x2="357" y2="364"/><line x1="357" y1="358" x2="351" y2="364"/>
  </g>
</svg>
