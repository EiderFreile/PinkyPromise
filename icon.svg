<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="114" fill="#1a0a0f"/>

  <!-- Pinky finger silhouette (simple, elegant) -->
  <!-- Palm base -->
  <rect x="196" y="310" width="120" height="80" rx="18" fill="#C9A84C"/>

  <!-- Pinky finger -->
  <rect x="316" y="240" width="52" height="130" rx="26" fill="#C9A84C"/>
  <!-- Pinky nail -->
  <rect x="320" y="218" width="44" height="52" rx="22" fill="#E8C97A" stroke="#C9A84C" stroke-width="3"/>

  <!-- Ring finger -->
  <rect x="256" y="200" width="54" height="155" rx="27" fill="#C9A84C"/>
  <!-- Ring nail -->
  <rect x="260" y="175" width="46" height="54" rx="23" fill="#E8C97A" stroke="#C9A84C" stroke-width="3"/>

  <!-- Middle finger -->
  <rect x="196" y="185" width="54" height="170" rx="27" fill="#C9A84C"/>
  <!-- Middle nail -->
  <rect x="200" y="158" width="46" height="56" rx="23" fill="#E8C97A" stroke="#C9A84C" stroke-width="3"/>

  <!-- Index finger -->
  <rect x="138" y="200" width="52" height="155" rx="26" fill="#C9A84C"/>
  <!-- Index nail -->
  <rect x="142" y="175" width="44" height="54" rx="22" fill="#E8C97A" stroke="#C9A84C" stroke-width="3"/>

  <!-- Thumb -->
  <rect x="92" y="280" width="48" height="110" rx="24" fill="#C9A84C"/>
  <!-- Thumb nail -->
  <rect x="96" y="260" width="40" height="48" rx="20" fill="#E8C97A" stroke="#C9A84C" stroke-width="3"/>

  <!-- Small sparkle top right -->
  <g transform="translate(400,90)" fill="#E8C97A">
    <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" opacity="0.9"/>
  </g>
  <!-- Tiny sparkle -->
  <g transform="translate(110,130)" fill="#C9A84C">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" opacity="0.7"/>
  </g>
</svg>
